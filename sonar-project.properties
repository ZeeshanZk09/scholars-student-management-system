# Project Identification
sonar.projectKey=scholars-student-management-system
sonar.projectName=scholars-student-management-system
sonar.projectVersion=0.1.0

# Server Connection
sonar.host.url=http://localhost:9000
# Token should be provided at runtime via environment variable SONAR_TOKEN

# Source Scope
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Test Scope & Inclusions
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# Exclusions (.next, node_modules, drizzle migrations, and tests from source analysis)
sonar.exclusions=**/.next/**,**/node_modules/**,**/drizzle/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/db/schema/**,src/types/**
sonar.cpd.exclusions=src/db/schema/relations.ts

# TypeScript & Environment Configuration
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.environments=browser,node

# Test Execution & Coverage Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
